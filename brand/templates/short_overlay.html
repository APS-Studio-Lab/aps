<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url(${FONTS}/Cairo-Black.ttf)}@font-face{font-family:Tajawal;src:url(${FONTS}/Tajawal-Bold.ttf)}
*{margin:0;padding:0}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
.top{position:absolute;top:150px;width:100%;text-align:center;direction:rtl}
.tag{display:inline-block;font:700 36px/1 Tajawal;color:#0a0a0a;background:#f5b400;padding:14px 26px 10px;border-radius:8px}
.l{font:900 96px/1.22 Cairo;color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.6)}
.y{color:#f5b400}
.bot{position:absolute;bottom:90px;width:100%;text-align:center;font:700 34px Tajawal;color:#f5b400;direction:rtl;text-shadow:0 2px 10px rgba(0,0,0,.8)}
</style></head><body><div class="top"><div class="tag">${TAG}</div><div class="l" style="margin-top:28px">${LINE1}</div><div class="l y">${LINE2}</div></div><div class="bot">${BRAND}</div></body></html>
