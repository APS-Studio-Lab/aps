<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url(${FONTS}/Cairo-Black.ttf);font-weight:900}
@font-face{font-family:Tajawal;src:url(${FONTS}/Tajawal-Bold.ttf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#050b08;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 28% 55%,#17402f 0%,#0b1f17 45%,#050b08 100%)}
.ghost{position:absolute;left:-30px;top:40px;font:900 470px/1 Cairo;color:#fff;opacity:.045;letter-spacing:-10px}
.host{position:absolute;left:-70px;bottom:-90px;height:800px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7)) brightness(1.05) contrast(1.08)}
.copy{position:absolute;right:60px;top:150px;width:620px;direction:rtl;text-align:right}
.tag{display:inline-block;font:700 30px/1 Tajawal;color:#0a0a0a;background:#f5b400;padding:12px 22px 8px;border-radius:6px;letter-spacing:1px}
.m{font:900 104px/1.2 Cairo;color:#fff;white-space:nowrap}
.y{color:#f5b400}
.brand{position:absolute;right:60px;bottom:40px;font:700 26px/1 Tajawal;color:#f5b400;opacity:.9;direction:rtl}
</style></head><body><div class="bg"></div><div class="ghost">${GHOST}</div><img class="host" src="${HOST}">
<div class="copy"><div class="tag">${TAG}</div><div class="m" style="margin-top:30px">${LINE1}</div><div class="m"><span class="y">${LINE2}</span></div></div>
<div class="brand">${BRAND}</div></body></html>
