<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}
html,body{width:${W}px;height:${H}px;overflow:hidden;position:relative;background:#06100c}
.slats{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0c2219 0px,#0c2219 46px,#07140f 46px,#07140f 52px)}
.shade{position:absolute;inset:0;background:
 radial-gradient(ellipse 38% 55% at ${PX} ${PY},rgba(255,196,110,.30) 0%,rgba(255,170,80,.10) 35%,rgba(0,0,0,0) 70%),
 linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.65) 100%),
 radial-gradient(ellipse 90% 90% at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 100%)}
.strip{position:absolute;left:0;right:0;bottom:${LINE_BOTTOM}px;height:4px;background:linear-gradient(90deg,rgba(245,180,0,0),rgba(245,180,0,.55),rgba(245,180,0,0))}
.bok{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.35),rgba(255,200,120,0) 70%)}
</style></head><body><div class="slats"></div><div class="shade"></div><div class="strip"></div>${BOKEH}</body></html>
