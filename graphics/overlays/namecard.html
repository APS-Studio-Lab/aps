<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../inserts/inserts.css">
<style>
/* Name card OVER the running video, in the archive style: a typed index card on aged paper slides in beside
   the presenter (who steps aside), the name inks in word by word, a licensed photo is paper-clipped on.
   Transparent page. D: name, role, name_en?, years?, photo? + photo_credit (required with a photo), kicker? */
html,body{background:transparent!important}
.card{position:absolute;inset:0;padding:6% 7% 6% 7%;display:flex;flex-direction:column;
  background:repeating-linear-gradient(180deg,transparent 0 calc(var(--u)*44),rgba(70,110,160,.28) calc(var(--u)*44) calc(var(--u)*46));
  background-position:0 calc(var(--u)*96)}
.redline{position:absolute;left:0;right:0;top:calc(var(--u)*86);height:calc(var(--u)*3);background:rgba(170,40,30,.7);mix-blend-mode:multiply}
.k{font:calc(var(--u)*24) Typewriter;opacity:.72}
.name{font:700 calc(var(--u)*64)/1.22 Amiri;margin-top:calc(var(--u)*22)}
.en{font:calc(var(--u)*27) Typewriter;opacity:.85;direction:ltr;text-align:right}
.role{font:calc(var(--u)*34)/1.5 AmiriR;margin-top:calc(var(--u)*10)}
.yrs{font:calc(var(--u)*27) Typewriter;margin-top:auto;direction:ltr;text-align:right}
.withphoto .card{padding-left:40%}
.photo{position:absolute;width:30%;aspect-ratio:3/4;left:5%;top:17%;background-size:cover;background-position:50% 22%;
  filter:grayscale(1) sepia(.4) contrast(1.08) brightness(.97);box-shadow:0 calc(var(--u)*5) calc(var(--u)*12) rgba(0,0,0,.4);
  outline:calc(var(--u)*7) solid #efe6d2}
.credit{position:absolute;left:5%;font:calc(var(--u)*13) Typewriter;opacity:.65;direction:ltr;white-space:nowrap}
.clip{position:absolute;width:calc(var(--u)*34);height:calc(var(--u)*100);border:calc(var(--u)*5) solid #8d8a83;
  border-radius:calc(var(--u)*18);box-shadow:0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.5)}
</style></head>
<body>
<script>/*DATA*/</script>
<script src="../inserts/inserts.js"></script>
<script>
installFilters();
if (!D.name || !D.role) throw new Error("namecard needs name and role");
if (D.photo && !D.photo_credit) throw new Error("a photo needs photo_credit (its source and licence)");
const side = D.side || "left";
const W = V ? innerWidth * 0.88 : innerWidth * 0.44;
const H = W * (V ? 0.66 : 0.56);
const X = V ? (innerWidth - W) / 2 : side === "left" ? innerWidth * 0.045 : innerWidth * 0.955 - W;
const Y = V ? innerHeight * 0.27 : innerHeight * 0.53 - H / 2;
const s = makeSheet(document.body, { w: W, h: H, x: X, y: Y, rot: V ? -1.2 : (side === "left" ? -2.2 : 2.2),
                                     seed: D.seed || 21, rough: .22 });
s.sheet.style.filter = "sepia(.42) saturate(1.2) brightness(1.04)";
if (D.photo) s.holder.classList.add("withphoto");
s.sheet.innerHTML = `
  <div class="redline"></div>
  <div class="card rtl ink">
    <div class="k">${D.kicker || "ملف · شخصيات الحدوتة"}</div>
    <div class="name" id="name">${D.name}</div>
    ${D.name_en ? `<div class="en" id="en">${D.name_en}</div>` : ""}
    <div class="role" id="role">${D.role}</div>
    ${D.years ? `<div class="yrs" id="yrs">${D.years}</div>` : ""}
  </div>
  ${D.photo ? `<div class="photo" id="ph" style="background-image:url('${D.photo}')"></div>
               <div class="credit" id="cr" style="top:calc(17% + ${W * 0.30 * 4 / 3}px + var(--u)*14)">${D.photo_credit}</div>` : ""}`;
const clip = el("div", "clip", s.holder);
clip.style.left = (D.photo ? 0.17 * W : 0.12 * W) + "px";
clip.style.top = (D.photo ? 0.17 * H - 40 * U : -30 * U) + "px";

window.render = (t) => {
  placeSheet(s, t, 0.0, { from: V ? [0, 0.6] : [side === "left" ? -0.55 : 0.55, 0.06], dur: .7,
                          startRot: side === "left" ? -10 : 10 });
  const out = seg(t, DUR - .55, DUR);
  if (out > 0) {  // slides back out the way it came
    const k = eInOut(out);
    s.holder.style.transform = `translate(${(V ? 0 : (side === "left" ? -1 : 1)) * k * innerWidth * .6}px,` +
      `${V ? k * innerHeight * .5 : 0}px) ` + s.holder.style.transform;
  }
  setWords($("name"), t, 0.75, .12);
  if ($("en")) $("en").style.opacity = seg(t, 1.05, 1.3);
  setWords($("role"), t, 1.15, .06);
  if ($("yrs")) $("yrs").style.opacity = seg(t, 1.6, 1.8);
  if ($("ph")) { $("ph").style.opacity = seg(t, .45, .75); $("cr").style.opacity = .65 * seg(t, .8, 1.1); }
};
window.render(0);
</script>
</body></html>
