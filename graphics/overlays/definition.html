<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Definition card OVER the running video (transparent page): term, English term, meaning, example, source. The presenter stays on screen.
   Content from window.D: name, role, name_en?, years?, photo? (licensed file), photo_credit (required with a
   photo), side? ("left" default in 16:9). Deterministic: window.render(t). */
@font-face{font-family:Cairo;src:url(../../brand/fonts/Cairo-Black.ttf);font-weight:900}
@font-face{font-family:Tajawal;src:url(../../brand/fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:Almarai;src:url(../../brand/fonts/Almarai-ExtraBold.ttf);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:transparent}
body{--u:calc(min(100vw,100vh)/1000);--gold:#c9a04f;--gold2:#f2dc98;--ink:#1b1712;--cream:#f3eee4;--green:#1e5435}
@media (orientation:portrait){body{--u:calc(100vw/1000)}}
#card{position:absolute;display:flex;gap:calc(var(--u)*34);align-items:center;direction:rtl;
  padding:calc(var(--u)*30) calc(var(--u)*36);border-radius:calc(var(--u)*22);
  background:linear-gradient(160deg,rgba(32,27,21,.93),rgba(18,15,11,.93));
  box-shadow:0 calc(var(--u)*18) calc(var(--u)*50) rgba(0,0,0,.45),inset 0 0 0 calc(var(--u)*1.5) rgba(201,160,79,.35);
  will-change:transform,opacity}
#ph{position:relative;flex:none;width:calc(var(--u)*230);height:calc(var(--u)*290);border-radius:calc(var(--u)*14);overflow:hidden;
  box-shadow:0 0 0 calc(var(--u)*3) var(--gold)}
#ph i{position:absolute;inset:0;background-size:cover;background-position:50% 25%;will-change:transform}
#txt{display:flex;flex-direction:column;min-width:calc(var(--u)*420);max-width:calc(var(--u)*640)}
#kick{font:700 calc(var(--u)*26) Tajawal;color:var(--gold);letter-spacing:.02em}
#rule{height:calc(var(--u)*4);background:linear-gradient(90deg,var(--gold2),var(--gold));margin:calc(var(--u)*14) 0 calc(var(--u)*16);
  transform-origin:100% 50%;border-radius:2px}
#name{font:900 calc(var(--u)*64)/1.18 Cairo;color:var(--cream)}
#en{font:700 calc(var(--u)*27) Tajawal;color:rgba(243,238,228,.62);direction:ltr;text-align:right;margin-top:calc(var(--u)*6)}
#role{font:800 calc(var(--u)*34)/1.45 Almarai;color:var(--gold2);margin-top:calc(var(--u)*16)}
#ex{font:700 calc(var(--u)*27)/1.5 Tajawal;color:rgba(243,238,228,.78);margin-top:calc(var(--u)*12)}
#cr{position:absolute;font:700 calc(var(--u)*15) Tajawal;color:rgba(243,238,228,.55);direction:ltr;white-space:nowrap}
.w{display:inline-block;will-change:transform,opacity}
</style></head>
<body>
<div id="card">
  <div id="ph"><i></i></div>
  <div id="txt"><div id="kick"></div><div id="rule"></div><div id="name"></div><div id="en"></div><div id="role"></div><div id="ex"></div></div>
</div>
<div id="cr"></div>
<script>/*DATA*/</script>
<script>
const D = window.D || {};
const DUR = D.seconds || 6;
const V = innerHeight > innerWidth;
const U = Math.min(innerWidth, innerHeight) / 1000;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eBack = (x) => { const c = 1.45; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

if (!D.term || !D.definition) throw new Error("definition needs term and definition");
D.name = D.term; D.name_en = D.term_en; D.role = D.definition; D.photo = null;
$("kick").textContent = D.kicker || "يعني إيه؟";
if (D.example) $("ex").innerHTML = "مثال: " + D.example; else $("ex").remove();
const words = (s) => s.split(/\s+/).filter(Boolean).map((w) => `<span class="w">${w}</span>`).join(" ");
$("name").innerHTML = words(D.name || "");
$("role").innerHTML = words(D.role || "");
if (D.name_en) $("en").textContent = D.name_en + (D.years ? "  ·  " + D.years : ""); else $("en").remove();
$("ph").remove();
if (D.source) $("cr").textContent = D.source; else $("cr").remove();

const card = $("card");
const side = D.side || "left";
function layout() {
  const r = card.getBoundingClientRect();
  if (V) {           // vertical: centred, upper third (below the headline band)
    card.style.left = (innerWidth - r.width) / 2 + "px";
    card.style.top = innerHeight * 0.30 + "px";
  } else {           // 16:9: beside the presenter, lower-middle of the free side
    const m = innerWidth * 0.055;
    card.style.left = (side === "left" ? m : innerWidth - r.width - m) + "px";
    card.style.top = innerHeight * 0.60 - r.height / 2 + "px";
  }
  const c = card.getBoundingClientRect(), p = $("ph") ? $("ph").getBoundingClientRect() : null;
  if ($("cr")) { $("cr").style.right = (innerWidth - c.right) + "px"; $("cr").style.top = c.bottom + 8 * U + "px"; }
}
layout();

function stagger(box, t, t0, step) {
  [...box.querySelectorAll(".w")].forEach((w, i) => {
    const k = eOut(seg(t, t0 + i * step, t0 + i * step + .35));
    w.style.opacity = k;
    w.style.transform = `translateY(${(1 - k) * 22 * U}px)`;
  });
}

window.render = (t) => {
  const tin = seg(t, 0, .55), tout = seg(t, DUR - .5, DUR);
  const dir = V ? 0 : (side === "left" ? -1 : 1);
  const x = dir * (1 - eBack(tin)) * 120 * U + dir * eOut(tout) * 90 * U;
  const y = V ? (1 - eOut(tin)) * 60 * U : 0;
  card.style.opacity = eOut(tin) * (1 - tout);
  card.style.transform = `translate(${x}px,${y}px) scale(${0.96 + 0.04 * eOut(tin)})`;
  if ($("cr")) $("cr").style.opacity = seg(t, 1.4, 1.8) * (1 - tout);
  if ($("ex")) $("ex").style.opacity = seg(t, 1.6, 2.1);
  $("rule").style.transform = `scaleX(${eOut(seg(t, .45, 1.0))})`;
  $("kick").style.opacity = seg(t, .35, .7);
  stagger($("name"), t, .55, .09);
  if ($("en")) $("en").style.opacity = seg(t, 1.0, 1.4);
  stagger($("role"), t, .95, .06);
};
window.render(0);
</script>
</body></html>
