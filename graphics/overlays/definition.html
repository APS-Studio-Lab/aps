<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../inserts/inserts.css">
<style>
/* Definition card OVER the running video, same archive index card as the name card: the term is typed in,
   a red line underlines it, then the meaning inks in word by word at the pace the presenter says it.
   Transparent page. D: term, meaning, term_en?, source?, kicker?, meaning_at? (s), meaning_per? (s per word) */
html,body{background:transparent!important}
body{--u:calc(min(100vw,100vh)/1220)}
@media (orientation:portrait){body{--u:calc(100vw/880)}}
.lamp{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(ellipse 85% 75% at 62% 35%,rgba(255,255,255,1) 35%,rgba(120,100,80,1) 100%)}
.card{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;
  background:repeating-linear-gradient(180deg,transparent 0 calc(var(--u)*44),rgba(70,110,160,.28) calc(var(--u)*44) calc(var(--u)*46));
  background-position:0 calc(var(--u)*96)}
.redline{position:absolute;left:0;right:0;top:calc(var(--u)*86);height:calc(var(--u)*3);background:rgba(170,40,30,.7);mix-blend-mode:multiply}
.k{font:calc(var(--u)*24) Typewriter;opacity:.72}
.term{font:700 calc(var(--u)*68)/1.2 Amiri;margin-top:calc(var(--u)*20);align-self:flex-start;position:relative}
.term .ul{position:absolute;right:0;bottom:calc(var(--u)*-2);height:calc(var(--u)*4);background:rgba(160,38,28,.75);
  mix-blend-mode:multiply;border-radius:calc(var(--u)*2)}
.en{font:calc(var(--u)*27) Typewriter;opacity:.85;direction:ltr;text-align:right;margin-top:calc(var(--u)*6)}
.mean{font:calc(var(--u)*36)/1.55 AmiriR;margin-top:calc(var(--u)*16)}
.src{font:calc(var(--u)*19) Typewriter;opacity:.7;margin-top:auto;direction:ltr;text-align:right}
</style></head>
<body>
<script>/*DATA*/</script>
<script src="../inserts/inserts.js"></script>
<script>
installFilters();
if (!D.term || !D.meaning) throw new Error("definition needs term and meaning");
const side = D.side || "left";
const W = V ? innerWidth * 0.78 : innerWidth * 0.36;
const H = W * (V ? 0.74 : 0.56);
const X = V ? (innerWidth - W) / 2 : side === "left" ? innerWidth * 0.045 : innerWidth * 0.955 - W;
const Y = V ? innerHeight * 0.58 : innerHeight * 0.53 - H / 2;   // 9:16: lower third, under the face
const s = makeSheet(document.body, { w: W, h: H, x: X, y: Y, rot: V ? 1.0 : (side === "left" ? -1.8 : 1.8),
                                     seed: D.seed || 33, rough: .22 });
s.sheet.style.filter = "sepia(.5) saturate(1.05) brightness(.72) contrast(.95)";  // in the set's light, never brighter
s.sheet.innerHTML = `
  <div class="redline"></div>
  <div class="card rtl ink">
    <div class="k">${D.kicker || "ملف · مصطلحات"}</div>
    <div class="term"><span id="term">${D.term}</span><div class="ul" id="ul"></div></div>
    ${D.term_en ? `<div class="en" id="en">${D.term_en}</div>` : ""}
    <div class="mean" id="mean">${D.meaning}</div>
    ${D.source ? `<div class="src" id="src">${D.source}</div>` : ""}
  </div>
  <div class="lamp"></div>`;
const tw = $("term").getBoundingClientRect().width;
const t0 = +(D.meaning_at ?? 1.5), per = +(D.meaning_per ?? .16);

window.render = (t) => {
  placeSheet(s, t, 0.0, { from: V ? [0, 0.6] : [side === "left" ? -0.55 : 0.55, 0.06], dur: .7,
                          startRot: side === "left" ? -10 : 10 });
  const out = seg(t, DUR - .55, DUR);
  if (out > 0) {
    const k = eInOut(out);
    s.holder.style.transform = `translate(${(V ? 0 : (side === "left" ? -1 : 1)) * k * innerWidth * .6}px,` +
      `${V ? k * innerHeight * .5 : 0}px) ` + s.holder.style.transform;
  }
  setWords($("term"), t, 0.7, .14);
  $("ul").style.width = tw * eOut(seg(t, 1.05, 1.45)) + "px";
  if ($("en")) $("en").style.opacity = seg(t, 1.1, 1.4);
  setWords($("mean"), t, t0, per);
  if ($("src")) $("src").style.opacity = .7 * seg(t, t0 + .3, t0 + .7);
};
window.render(0);
</script>
</body></html>
