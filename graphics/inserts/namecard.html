<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css">
<style>
/* a typed archive index card for a person in the story: name, role, years. Text only unless a licensed
   photo is supplied (D.photo, with D.photo_credit). */
.card{position:absolute;inset:0;padding:7% 7%;display:flex;flex-direction:column;
  background:repeating-linear-gradient(180deg,transparent 0 calc(var(--u)*46),rgba(70,110,160,.30) calc(var(--u)*46) calc(var(--u)*48));
  background-position:0 calc(var(--u)*110)}
.redline{position:absolute;left:0;right:0;top:calc(var(--u)*100);height:calc(var(--u)*3);background:rgba(170,40,30,.7);mix-blend-mode:multiply}
.k{font:calc(var(--u)*24) Typewriter;opacity:.7}
.name{font:700 calc(var(--u)*66)/1.25 Amiri;margin-top:calc(var(--u)*34)}
.en{font:calc(var(--u)*30) Typewriter;opacity:.85}
.role{font:calc(var(--u)*36)/1.5 AmiriR;margin-top:calc(var(--u)*14)}
.yrs{font:calc(var(--u)*30) Typewriter;margin-top:auto}
.photo{position:absolute;width:30%;aspect-ratio:3/4;left:6%;top:16%;background-size:cover;background-position:center;
  filter:grayscale(1) sepia(.35) contrast(1.05);box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(0,0,0,.35)}
.credit{position:absolute;left:6%;top:calc(16% + 30% * 4 / 3 * 1.0);font:calc(var(--u)*14) Typewriter;opacity:.6}
.clip{position:absolute;width:calc(var(--u)*38);height:calc(var(--u)*110);left:11%;top:calc(var(--u)*-30);
  border:calc(var(--u)*5) solid #8d8a83;border-radius:calc(var(--u)*20);box-shadow:0 calc(var(--u)*4) calc(var(--u)*6) rgba(0,0,0,.5)}
</style></head>
<body>
<script>/*DATA*/</script>
<script src="inserts.js"></script>
<script>
Scene.build("layout_table.jpeg", { push: 0.045, panY: -0.005 });
const W = V ? innerWidth * 0.86 : innerWidth * 0.46;
const H = W * (V ? 0.78 : 0.58);
const s = makeSheet(Scene.stage, { w: W, h: H, x: (innerWidth - W) / 2 + (V ? 0 : innerWidth * 0.02),
                                   y: (innerHeight - H) / 2, rot: V ? -1.4 : -2.6, seed: D.seed || 21, rough: .25 });
s.sheet.style.backgroundImage = `url(${PLATES}newsprint_blank.jpeg)`;
s.sheet.style.filter = "sepia(.42) saturate(1.2) brightness(1.02)";
s.sheet.innerHTML = `
  <div class="redline"></div>
  <div class="card rtl ink">
    <div class="k">${D.kicker || "ملف · شخصيات الحدوتة"}</div>
    <div class="name" id="name">${D.name}</div>
    ${D.name_en ? `<div class="en ltr" style="direction:ltr;text-align:right">${D.name_en}</div>` : ""}
    <div class="role" id="role">${D.role}</div>
    ${D.years ? `<div class="yrs ltr" style="text-align:right">${D.years}</div>` : ""}
  </div>
  ${D.photo ? `<div class="photo" style="background-image:url('${D.photo}')"></div><div class="credit ltr">${D.photo_credit || ""}</div>` : ""}`;
const clip = el("div", "clip", s.holder);
bindRender((t) => {
  placeSheet(s, t, 0.05, { from: V ? [0.0, 0.55] : [0.4, -0.3], dur: .8, startRot: 7 });
  setWords($("name"), t, 0.9, .12);
  setWords($("role"), t, 1.25, .06);
});
</script>
</body></html>
