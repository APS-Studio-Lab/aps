<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css"><link rel="stylesheet" href="titlecard.css">
<!-- Explainer drawn by hand on the archive paper (D.plate: layout_sheet.jpeg by default, or newsprint_blank.jpeg),
     dark ink with a red pencil. (D.style "dark": over a dimmed moving clip instead, cream ink.)
     Every step can be tied to the presenter's words: D.beats = {key: seconds} (resolved from phrases by the
     pipeline); a diagram reads them with T(D, key, default). D: diagram, beats?, credit?, + the diagram's own fields -->
<style>
#dim{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%,rgba(8,6,4,.58),rgba(4,3,2,.84) 100%)}
#board{position:absolute;inset:0;will-change:transform}
svg#dg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg#dg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ink{stroke:#cdbf9f;opacity:.92}
.red{stroke:#b04a3c}
.lbl{position:absolute;white-space:nowrap;color:#d8ccb2;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.lbl.red{color:#c0574a}
.lbl.dim{color:#a89c86}
.dotc{fill:#cdbf9f}
.dotc.red{fill:#b04a3c}
/* paper: real ink on the sheet */
body.paper #dim{display:none}
body.paper .ink{stroke:#231a10;opacity:1;mix-blend-mode:multiply;filter:url(#rough)}
body.paper .red{stroke:#a8231a;mix-blend-mode:multiply;filter:url(#rough)}
body.paper .lbl{color:#231a10;mix-blend-mode:multiply;text-shadow:0 0 1px rgba(35,26,16,.5)}
body.paper .lbl.red{color:#a3150e}
body.paper .lbl.dim{color:#4a3d2c}
body.paper .dotc{fill:#231a10;mix-blend-mode:multiply}
body.paper .dotc.red{fill:#a3150e}
/* paper: the light falls evenly, only the far corners settle into shadow (no hard spotlight) */
body.paper .lamp{background:radial-gradient(ellipse 140% 130% at 50% 45%,rgba(255,214,160,.05) 0%,rgba(0,0,0,0) 45%,rgba(40,25,10,.16) 100%)}
body.paper .vignette{background:radial-gradient(ellipse 150% 140% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.22) 100%)}
</style></head>
<body>
<div id="dim"></div>
<script>/*DATA*/</script>
<script src="inserts.js"></script><script src="titlecard.js"></script>
<script src="diagrams.js"></script>
<script>
const PAPER = D.style !== "dark";
if (PAPER) { document.body.classList.add("paper"); Scene.build(D.plate || "layout_sheet.jpeg", { push: 0.02 }); }
const VB = V ? [900, 1500] : [1600, 900];
const board = el("div", "", PAPER ? Scene.stage : document.body); board.id = "board";
board.innerHTML = `<svg id="dg" viewBox="0 0 ${VB[0]} ${VB[1]}" preserveAspectRatio="xMidYMid meet"></svg>`;
const svg = $("dg"), NS = "http://www.w3.org/2000/svg";
const K = Math.min(innerWidth / VB[0], innerHeight / VB[1]) * (PAPER ? 0.9 : 1), OX = (innerWidth - VB[0] * K) / 2, OY = (innerHeight - VB[1] * K) / 2;
// the drawing and the labels share one frame: viewBox units * K, offset (OX, OY)
svg.style.cssText = `inset:auto;left:${OX}px;top:${OY}px;width:${VB[0] * K}px;height:${VB[1] * K}px`;
const build = DIAGRAMS[D.diagram];
if (!build) throw new Error("unknown diagram " + D.diagram);
const steps = build(VB[0], VB[1], V, D);
const dark = el("div", "", document.body); dark.id = "dark";
const dust = PAPER ? () => {} : dustLayer(16, 3);

function wobble(x1, y1, x2, y2, seed, amp = 3) {     // a hand-drawn line: gentle bow + jitter
  const r = rng(seed), n = 6, pts = [];
  const nx = -(y2 - y1), ny = x2 - x1, L = Math.hypot(nx, ny) || 1, bow = (r() - .5) * amp * 2;
  for (let i = 0; i <= n; i++) {
    const k = i / n, b = Math.sin(k * Math.PI) * bow + (i && i < n ? (r() - .5) * amp : 0);
    pts.push([x1 + (x2 - x1) * k + nx / L * b, y1 + (y2 - y1) * k + ny / L * b]);
  }
  return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join(" L");
}
function circlePath(cx, cy, r, seed) {               // a slightly imperfect pen circle, overshooting its start
  const R = rng(seed), n = 40, a0 = R() * 6.28, pts = [];
  for (let i = 0; i <= n + 3; i++) {
    const a = a0 + i / n * Math.PI * 2, rr = r * (1 + (R() - .5) * .04);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join(" L");
}
function pathEl(d, s) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d); p.setAttribute("class", s.red ? "red" : "ink");
  p.style.strokeWidth = s.w || (s.red ? 6 : 4); svg.appendChild(p); return p;
}
const items = [], byId = {};
let seed = 100;
for (const s of steps) {
  seed++;
  if (s.k === "line" || s.k === "arrow" || s.k === "path" || s.k === "circle") {
    let d = s.k === "path" ? s.path : s.k === "circle" ? circlePath(s.c[0], s.c[1], s.r, seed) : wobble(...s.p, seed, s.amp ?? 3);
    if (s.k === "arrow") {
      const [x1, y1, x2, y2] = s.p, a = Math.atan2(y2 - y1, x2 - x1), h = s.head || 22;
      d += ` M${x2 - h * Math.cos(a - .45)} ${y2 - h * Math.sin(a - .45)} L${x2} ${y2} L${x2 - h * Math.cos(a + .45)} ${y2 - h * Math.sin(a + .45)}`;
    }
    items.push({ s, e: pathEl(d, s), draw: true });
  } else if (s.k === "dot") {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", s.c[0]); c.setAttribute("cy", s.c[1]); c.setAttribute("r", s.r || 12);
    c.setAttribute("class", s.red ? "dotc red" : "dotc"); svg.appendChild(c); items.push({ s, e: c });
  } else if (s.k === "text") {
    // labels are HTML (proper Arabic bidi), positioned in viewBox units; x is the anchor, y the baseline
    const tx = el("div", "lbl" + (s.red ? " red" : "") + (s.dim ? " dim" : ""), board);
    const arabic = /[؀-ۿ]/.test(s.s), a = s.anchor || "middle";
    tx.style.cssText += `left:${OX + s.x * K}px;top:${OY + s.y * K}px;font:${s.bold === false ? "" : "700 "}${(s.size || 40) * K}px ${s.font || "Amiri"};` +
      `direction:${arabic ? "rtl" : "ltr"};transform:translate(${a === "start" ? 0 : a === "end" ? -100 : -50}%,-78%)`;
    tx.textContent = s.s;
    if (s.id) byId[s.id] = tx;
    // written on like a pen: revealed in the reading direction, as long as the word takes to write
    items.push({ s, e: tx, write: Math.min(1.1, Math.max(.25, .055 * s.s.length)), rtl: arabic });
  }
}
// strike-throughs measured on the words they cross, every frame (so they always fit the word as set)
const strikes = steps.filter((s) => s.k === "strike").map((s) => {
  const it = { s: Object.assign({ red: true, w: 6 }, s), e: pathEl("M0 0", Object.assign({ red: true, w: 6 }, s)), draw: true, sd: ++seed };
  items.push(it); return it;
});
function fitStrikes() {
  const bs = board.style.transform; board.style.transform = "none";
  if (PAPER) Scene.cam.style.transform = "none";
  for (const it of strikes) {
    const b = byId[it.s.of].getBoundingClientRect();
    const x1 = (b.left - OX) / K - 6, x2 = (b.right - OX) / K + 6, y = (b.top + b.height * .6 - OY) / K;
    it.e.setAttribute("d", wobble(x2, y, x1, y + 3, it.sd, 2));
  }
  board.style.transform = bs;
}
// the pen's sound follows the ink: one event per stroke, word and dot (read by the pipeline)
window.SFX = items.map((it) => it.draw ? { t: it.s.t, dur: it.s.dur || .5, kind: "line" }
  : it.write ? { t: it.s.t, dur: it.write, kind: "write" } : { t: it.s.t, dur: .06, kind: "tap" })
  .filter((e) => e.t >= 0 && e.t < DUR);
window.render = (t) => {
  board.style.transform = "none"; fitStrikes();
  dark.style.opacity = PAPER ? 0 : Math.max(1 - eOut(seg(t, 0, .3)), seg(t, DUR - .3, DUR));
  if (PAPER) Scene.frame(t);
  else board.style.transform = `scale(${1 + .025 * eInOut(seg(t, 0, DUR))})`;
  dust(t);
  for (const it of items) {
    const t0 = it.s.t;
    if (it.draw) drawPath(it.e, t, t0, it.s.dur || .5);
    else if (it.write) {
      const k = clamp((t - t0) / it.write);
      it.e.style.opacity = (it.s.dim ? .85 : 1) * clamp((t - t0) / .08);
      it.e.style.clipPath = k >= 1 ? "none" : (it.rtl ? `inset(-20% 0 -20% ${(1 - k) * 100}%)` : `inset(-20% ${(1 - k) * 100}% -20% 0)`);
    }
    else it.e.style.opacity = (it.s.dim ? .85 : 1) * clamp((t - t0) / .22);
  }
};
window.render(0);
</script>
</body></html>
