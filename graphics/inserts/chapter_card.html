<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css">
<!-- Chapter card in the archive style, TRANSPARENT layer over a moving clip (data.bg_video, the press):
     a fresh sheet is laid over the running press, the chapter number thumps on like a stamp and the title
     inks in word by word. D: number, title, kicker? Deterministic: window.render(t). -->
<style>
html,body{background:transparent!important}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 70% at 50% 48%,rgba(12,8,4,.15),rgba(8,5,2,.7) 100%)}
#dark{position:absolute;inset:0;background:#000}
.body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6% 8%;text-align:center}
.kick{font:calc(var(--u)*34) AmiriR}
.num{font:700 calc(var(--u)*230)/1 Amiri}
.ttl{font:700 calc(var(--u)*64)/1.3 Amiri;margin-top:calc(var(--u)*12)}
.rule{width:60%;margin-top:calc(var(--u)*14)}
</style></head>
<body>
<div id="shade"></div>
<script>/*DATA*/</script>
<script src="inserts.js"></script>
<script>
installFilters();
if (!D.number || !D.title) throw new Error("chapter needs number and title");
const dark = el("div", "", document.body); dark.id = "dark";
const W = V ? innerWidth * 0.84 : innerWidth * 0.40, H = W * (V ? 1.05 : 0.82);
const sh = makeSheet(document.body, { w: W, h: H, x: (innerWidth - W) / 2, y: (innerHeight - H) / 2,
                                      rot: V ? 1.2 : 1.8, seed: D.seed || 17, rough: .5 });
sh.sheet.style.filter = "sepia(.3) saturate(1.1) brightness(1.03)";
sh.sheet.innerHTML = `<div class="body ink rtl">
  <div class="kick" id="kk">${D.kicker || "الفصل"}</div>
  <div class="num" id="nm">${D.number}</div>
  <div class="rule" id="rl"></div>
  <div class="ttl" id="tt" style="text-align:center">${D.title}</div></div>`;
window.render = (t) => {
  dark.style.opacity = Math.max(1 - eOut(seg(t, 0, .3)), seg(t, DUR - .3, DUR));
  placeSheet(sh, t, 0.15, { from: V ? [0, 0.6] : [0, 0.55], dur: .6, startRot: -6 });
  $("kk").style.opacity = seg(t, .6, .8);
  thump($("nm"), t, .75, 0);
  stroke($("rl"), t, 1.0, .35);
  setWords($("tt"), t, 1.15, .12);
};
window.render(0);
</script>
</body></html>
