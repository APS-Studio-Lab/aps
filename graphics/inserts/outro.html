<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css">
<style>
/* the case is filed: a stack of old papers under the lamp; on the dark side, the closing line and a stamp */
#txt{position:absolute;display:flex;flex-direction:column;align-items:center;color:#e9dcc0}
#txt .l1{font:700 calc(var(--u)*78)/1.3 Amiri;text-shadow:0 0 calc(var(--u)*14) rgba(0,0,0,.8)}
#txt .l2{font:calc(var(--u)*36)/1.5 AmiriR;opacity:.85;margin-top:calc(var(--u)*16);text-align:center}
#txt .brand{font:calc(var(--u)*26) Typewriter;opacity:.6;margin-top:calc(var(--u)*40);letter-spacing:calc(var(--u)*2)}
.stamp.dark{color:#d8392c;border-color:#d8392c;mix-blend-mode:normal}
#dark{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body>
<script>/*DATA*/</script>
<script src="inserts.js"></script>
<script>
Scene.build("paper_stack.jpeg", { push: 0.05, panX: V ? 0 : -0.015, posX: V ? 0.28 : 0.5 });
const box = el("div", "rtl", document.body); box.id = "txt";
if (V) box.style.cssText += "left:6%;right:6%;top:9%"; else box.style.cssText += "left:52%;right:4%;top:30%";
box.innerHTML = `<div class="l1" id="l1">${D.line || "الملف اتقفل.. لحد دلوقتي"}</div>
  ${D.line2 ? `<div class="l2" id="l2">${D.line2}</div>` : ""}
  ${D.brand ? `<div class="brand">${D.brand}</div>` : ""}`;
const st = el("div", "stamp dark", document.body, D.stamp || "اتقفل");
st.style.cssText += `font:calc(var(--u)*84)/1 Ruqaa;padding:calc(var(--u)*14) calc(var(--u)*34) calc(var(--u)*6);` +
  (V ? "left:34%;top:25%" : "left:64%;top:12%");
const dark = el("div", "", document.body); dark.id = "dark";
if (V) { const sc = el("div", "", Scene.cam); sc.style.cssText = "position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,.55) 30%,rgba(0,0,0,0) 48%)"; }
bindRender((t) => {
  setWords($("l1"), t, .7, .14);
  if ($("l2")) setWords($("l2"), t, 1.8, .06);
  thump(st, t, 2.6, -9); st.style.opacity = t < 2.6 ? 0 : .55 + .35 * seg(t, 2.6, 2.8);
  dark.style.opacity = Math.max(1 - seg(t, 0, .5), seg(t, DUR - .6, DUR));
});
</script>
</body></html>
