<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css"><link rel="stylesheet" href="titlecard.css">
<!-- Episode outro over a moving archive clip (data.bg_video), in the end-card style: the closing line inks in,
     a muted red stamp lands, the logo fades up small, then the lamp goes out.
     D: line (required), line2?, stamp?, logo?, place? -->
<style>
#logo{width:calc(var(--u)*300);filter:brightness(.8) saturate(.9);margin-top:calc(var(--u)*46)}
#st{position:relative;display:inline-block;margin-top:calc(var(--u)*30);font:calc(var(--u)*64)/1 Ruqaa;
  color:rgba(150,44,34,.78);border:calc(var(--u)*3) solid rgba(150,44,34,.62);
  padding:calc(var(--u)*12) calc(var(--u)*30) calc(var(--u)*4)}
</style>
</head><body>
<div id="shade"></div>
<div id="stack"><div class="ttl cream" id="l1"></div><div class="sub muted" id="l2"></div><div id="st"></div><img id="logo"></div>
<script>/*DATA*/</script>
<script src="inserts.js"></script><script src="titlecard.js"></script>
<script>
if (!D.line) throw new Error("outro needs data.line");
$("l1").textContent = D.line; $("l2").textContent = D.line2 || "";
$("st").textContent = D.stamp || ""; if (!D.stamp) $("st").style.display = "none";
if (D.logo) $("logo").src = D.logo; else $("logo").style.display = "none";
if (V) { $("logo").style.width = 330 * U + "px"; $("l1").style.cssText = `font-size:${62 * U}px;white-space:nowrap`; }
placeStack($("stack"), $("shade"));
const dark = el("div", "", document.body); dark.id = "dark";
const dust = dustLayer(20, 7);
window.render = (t) => {
  // fades up from black; at the end the lamp flickers out
  const off = t < DUR - 1.2 ? 0 : t < DUR - 1.0 ? .6 : t < DUR - .85 ? .15 : t < DUR - .7 ? .8 : seg(t, DUR - .7, DUR - .2);
  dark.style.opacity = Math.max(1 - eOut(seg(t, 0, .6)), off);
  dust(t);
  inkWords($("l1"), t, .7, .16);
  $("l2").style.opacity = eOut(seg(t, 2.0, 2.6));
  const k = seg(t, 2.9, 3.05);                            // stamp lands
  $("st").style.opacity = k;
  $("st").style.transform = `rotate(-7deg) scale(${1.35 - .35 * eOut(k)})`;
  $("logo").style.opacity = .9 * eOut(seg(t, 3.6, 4.4));
};
window.render(0);
</script></body></html>
