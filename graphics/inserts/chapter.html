<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="inserts.css">
</head>
<body>
<script>/*DATA*/</script>
<script src="inserts.js"></script>
<script>
// The bound volume lies open with the chapter printed in old ink on its right page. The print is baked into the
// plate beforehand (studio_post/printplate.py): it follows the page's curve, the paper's relief and its light.
const POSX = V ? 0.86 : 0.5;
if (!D.baked) throw new Error("chapter needs a baked plate (rendered by studio_post.inserts)");
Scene.build(D.baked, { push: 0.07, panX: V ? 0 : -0.01, panY: 0.01, posX: POSX });
// the same page before the ink is visible, fading away as the camera finds focus
const clean = el("div", "plate", Scene.cam);
clean.style.backgroundImage = `url(${PLATES}bound_volume.jpeg)`;
clean.style.backgroundPosition = `${POSX * 100}% 50%`;
Scene.cam.insertBefore(clean, Scene.stage);
bindRender((t) => { clean.style.opacity = 0.65 * (1 - eOut(seg(t, 0.2, 1.0))); });
</script>
</body></html>
