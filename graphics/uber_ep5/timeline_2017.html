<script src="../_lib/common.js"></script><script>
const at=[0.9,1.7,2.5,3.4,4.5];
window.render=(t)=>{
 show($('h'),eOut(seg(t,0.1,0.7)),30);
 $('line').style.width=(1640*eInOut(seg(t,0.6,5.0)))+'px';
 at.forEach((a,i)=>{const e=$('e'+(i+1)); const p=eOut(seg(t,a,a+0.5)); const dim=(i==3)?0:0.55*seg(t,5.4,5.8); e.style.opacity=p*(1-dim); e.style.transform=`translateY(${(1-p)*30}px)`;
   e.querySelector('.dot').style.transform=`scale(${(i==3?1.25:1)*eBack(seg(t,a,a+0.4))})`;});
 
 document.body.style.opacity=1-seg(t,7.6,8.0);
};
