name: Fetch from Wikimedia Commons
# Downloads free-licence Commons files (a PDF page as a large JPEG) with their licence into 00_Brand/archive/commons/.
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'Newline-separated "File:Name.pdf|page" items'
        required: true
env:
  STUDIO_ROOT: ${{ secrets.STUDIO_ROOT || vars.STUDIO_ROOT }}
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/tools.sh
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Drive access
        env: { RCLONE_CONF: "${{ secrets.RCLONE_CONF }}" }
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Fetch
        env: { ITEMS: "${{ inputs.items }}" }
        run: |
          set -e
          mapfile -t arr <<< "$ITEMS"
          python3 scripts/fetch_commons.py out "${arr[@]}"
          rclone copy out "gdrive:$STUDIO_ROOT/00_Brand/archive/commons" -q
