name: Audio probe
# Looks at the sound of a stretch of a file: waveform picture, loudness every 50 ms and the pauses found by the
# voice detector, uploaded to 02_Renders/_probe_audio/ (logs show no names).
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path under the studio folder"
        required: true
      start:
        description: "Start second"
        required: false
        default: "0"
      dur:
        description: "Seconds"
        required: false
        default: "60"
      af:
        description: "Optional ffmpeg audio filter before analysis, e.g. afftdn=nf=-30:tn=1"
        required: false
        default: ""
      frames:
        description: "Instead of a probe: still frames of the file at these seconds (comma-separated), to 02_Renders/_frames/<words or 'frames'>"
        required: false
        default: ""
      limit:
        description: "Instead of a probe: re-limit the audio of these files (comma-separated paths) to -1 dBTP, picture untouched"
        required: false
        default: ""
      words:
        description: "Instead of a probe: word-timed transcript of the whole file, saved as 02_Renders/_transcripts/<words>.words.json"
        required: false
        default: ""
env:
  STUDIO_ROOT: ${{ secrets.STUDIO_ROOT || vars.STUDIO_ROOT }}

jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/tools.sh && pip install -q "faster-whisper>=1.0" opencv-python-headless numpy
      - name: Drive access
        env: { RCLONE_CONF: "${{ secrets.RCLONE_CONF }}" }
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Frames
        if: inputs.frames != ''
        env: { P: "${{ inputs.path }}", T: "${{ inputs.frames }}", O: "${{ inputs.words || 'frames' }}" }
        run: |
          set -e
          echo "::add-mask::$P"; echo "::add-mask::$O"
          mkdir -p "out/$O"
          if [ "$T" = "sheet" ]; then  # a folder of photos -> numbered contact sheets for picking
            rclone copy "gdrive:$STUDIO_ROOT/$P" photos -q
            pip install -q pillow && python scripts/contact_sheet.py photos "out/$O"
            rclone copy out "gdrive:$STUDIO_ROOT/02_Renders/_frames" -q
            echo done; exit 0
          fi
          rclone copyto "gdrive:$STUDIO_ROOT/$P" in.media -q
          if [ "$T" = "audio" ]; then  # the whole sound track, small (Opus), for timing checks
            ffmpeg -v error -y -i in.media -vn -ac 1 -ar 24000 -c:a libopus -b:a 24k "out/$O/audio.ogg"
            T=""
          fi
          IFS=',' read -ra TS <<< "$T"
          for t in "${TS[@]}"; do
            ffmpeg -v error -y -ss "$t" -i in.media -frames:v 1 -vf scale=640:-2 -q:v 3 "out/$O/f_${t}.jpg"
          done
          rclone copy out "gdrive:$STUDIO_ROOT/02_Renders/_frames" -q
          echo done
      - name: Limit audio peaks
        if: inputs.limit != ''
        env: { L: "${{ inputs.limit }}" }
        run: |
          set -e
          echo "::add-mask::$L"
          IFS=',' read -ra FILES <<< "$L"
          for f in "${FILES[@]}"; do
            rclone copyto "gdrive:$STUDIO_ROOT/$f" in.mp4 -q
            ffmpeg -v error -y -i in.mp4 -map 0:v -map 0:a -c:v copy \
              -af "alimiter=limit=0.7:level=false:attack=2:release=60,aresample=48000" -c:a aac -b:a 192k \
              -movflags +faststart out.mp4
            ffmpeg -hide_banner -i out.mp4 -vn -af ebur128=peak=true -f null - 2>&1 | grep -A1 "True peak" | tail -1
            rclone copyto out.mp4 "gdrive:$STUDIO_ROOT/$f" -q
            rm -f in.mp4 out.mp4
          done
          echo done
      - name: Transcribe
        if: inputs.words != '' && inputs.frames == ''
        env: { P: "${{ inputs.path }}", O: "${{ inputs.words }}" }
        run: |
          set -e
          echo "::add-mask::$P"; echo "::add-mask::$O"
          pip install -q -r requirements.txt
          rclone copyto "gdrive:$STUDIO_ROOT/$P" in.media -q
          mkdir -p out
          python scripts/transcribe.py in.media "out/$O"
          rclone copy out "gdrive:$STUDIO_ROOT/02_Renders/_transcripts" -q
          echo done
      - name: Probe
        if: inputs.words == '' && inputs.limit == '' && inputs.frames == ''
        env: { P: "${{ inputs.path }}", S: "${{ inputs.start }}", D: "${{ inputs.dur }}", AF: "${{ inputs.af }}" }
        run: |
          set -e
          rclone copyto "gdrive:$STUDIO_ROOT/$P" in.media
          mkdir -p out
          ffmpeg -v error -ss "$S" -t "$D" -i in.media -vn -ac 1 -ar 48000 ${AF:+-af "$AF"} -c:a pcm_s16le out/a.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,bit_rate -select_streams a -of default=nw=1 in.media
          python3 scripts/audio_probe.py out/a.wav "$S" out
          python3 antigravity/montage/pauses.py find out/a.wav --out out/pauses
          rm out/a.wav
          rclone copy out "gdrive:$STUDIO_ROOT/02_Renders/_probe_audio" -q
          echo done
