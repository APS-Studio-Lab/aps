name: Probe footage
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path under the studio folder, e.g. 01_Inbox/E3/E3.mp4"
        required: true
      times:
        description: "Optional space-separated seconds to grab frames at (instead of 5 spread frames)"
        required: false
        default: ""
env:
  STUDIO_ROOT: ${{ secrets.STUDIO_ROOT || vars.STUDIO_ROOT }}   # Drive folder name; keep it a secret so public logs mask it

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg rclone > /dev/null
      - name: Drive access
        env: { RCLONE_CONF: "${{ secrets.RCLONE_CONF }}" }
        run: mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Probe
        env: { P: "${{ inputs.path }}", TIMES: "${{ inputs.times }}" }
        run: |
          set -e
          rclone copyto "gdrive:$STUDIO_ROOT/$P" in.media
          case "$P" in *.jpg|*.jpeg|*.png|*.webp) ffprobe -v error -show_entries stream=width,height -of default=nw=1 in.media; exit 0;; esac
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,width,height,r_frame_rate,color_transfer,color_primaries,channels,sample_rate -of default=nw=1 in.media
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 in.media)
          mkdir frames
          if [ -n "$TIMES" ]; then
            for t in $TIMES; do ffmpeg -v error -ss $t -i in.media -frames:v 1 -vf scale=-2:360 frames/t_$t.jpg; done
            python3 scripts/contact_sheet.py
          else
          for f in 0.05 0.25 0.5 0.75 0.95; do t=$(python3 -c "print($D*$f)"); ffmpeg -v error -ss $t -i in.media -frames:v 1 -vf "zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,tonemap=hable,zscale=t=bt709:m=bt709:r=tv,format=yuv420p,scale=-2:540" frames/f_$f.jpg || ffmpeg -v error -ss $t -i in.media -frames:v 1 -vf scale=-2:540 frames/f_$f.jpg; done
          fi
          ffmpeg -v error -i in.media -map 0:a:0 -af "volumedetect" -f null - 2>&1 | grep -E "mean_volume|max_volume" || true
          ffmpeg -v error -i in.media -map 0:a:0 -af silencedetect=n=-40dB:d=1.5 -f null - 2>&1 | grep -c silence_end || true
          rclone copy frames "gdrive:$STUDIO_ROOT/02_Renders/_probe/$(dirname "$P" | tr / _)"
